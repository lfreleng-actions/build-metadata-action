# A workspace exercising how cargo finds the members it publishes.

[workspace]
members = ["crates/*", "tools/kept"]
exclude = ["crates/excluded", "tools"]

[workspace.package]
version = "1.2.3"
publish = ["internal"]

[workspace.dependencies]
shared = { path = "libs/shared" }

[package]
name = "ws-root"
version = "0.9.0"
edition = "2021"

[dependencies]
implicit = { path = "implicit" }
