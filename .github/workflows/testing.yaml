  ### Rust: toolchain file, publishable packages, nothing executed ###
  test-rust:
    name: "Test: Rust metadata"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      # yamllint disable-line rule:line-length
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c  # v2.23.0
        with:
          egress-policy: audit

      - name: "Checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Checkout test-rust-project"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: lfreleng-actions/test-rust-project
          ref: "5db6f8f6624e676d1d76f8db02a0253fee39900c" # v0.0.1
          path: test-rust-project
          persist-credentials: false

      - name: "Generate Rust fixtures"
        shell: bash
        run: |
          set -euo pipefail
          root="$GITHUB_WORKSPACE/rust-fixtures"
          mkdir -p "$root"

          # A project for the path-toolchain check below
          suffix="$(od -An -N4 -tx4 /dev/urandom | tr -d ' ')"
          crate="lfreleng-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${suffix}"
          project="$root/path-toolchain"
          mkdir -p "$project/src"
          printf '[package]\nname = "%s"\nversion = "0.1.0"\n' "$crate" \
            > "$project/Cargo.toml"
          : > "$project/src/lib.rs"

          # The extractor's workspace fixture, with sources for cargo
          cp -R internal/extractor/rust/testdata/workspace "$root/workspace"
          find "$root/workspace" -name Cargo.toml -print0 |
            while IFS= read -r -d '' manifest; do
              mkdir -p "${manifest%/Cargo.toml}/src"
              : > "${manifest%/Cargo.toml}/src/lib.rs"
            done

          git -C "$root" init -q
          git -C "$root" add -A
          git -C "$root" -c user.name=ci -c user.email=ci@example.invalid \
            commit -q -m "Rust fixtures"

          # cargo itself decides what the workspace fixture publishes
          cd "$root/workspace"
          cargo metadata --no-deps --format-version 1 --offline |
            jq -c '(.workspace_root + "/") as $root
              | [.packages[] | select(.publish != [])
                | {name, version,
                   manifest_path: (.manifest_path | ltrimstr($root))}
                  + if .publish == null then {}
                    else {registries: .publish} end]
              | sort_by(.manifest_path)' \
            > "$RUNNER_TEMP/workspace-packages.json"

      - name: "Run on test-rust-project"
        id: project
        uses: $/
        with:
          path_prefix: test-rust-project

      - name: "Run on the workspace fixture"
        id: workspace
        uses: $/
        with:
          path_prefix: rust-fixtures/workspace

      # The action runs with GITHUB_WORKSPACE as its working directory,
      # so a toolchain file there is what rustup would read if the action
      # ran cargo or rustc from it. Each marker binary leaves EXECUTED
      # behind when run.
      - name: "Select a path toolchain for the whole workspace"
        shell: bash
        run: |
          set -euo pipefail
          marker="$GITHUB_WORKSPACE/marker-toolchain"
          mkdir -p "$marker/bin"
          for tool in cargo rustc; do
            script='#!/bin/sh\ntouch "%s/EXECUTED"\necho "%s 9.9.9 (marker)"\n'
            # shellcheck disable=SC2059 # the format is the script above
            printf "$script" "$marker" "$tool" > "$marker/bin/$tool"
            chmod +x "$marker/bin/$tool"
          done
          printf '[toolchain]\npath = "%s"\n' "$marker" \
            > "$GITHUB_WORKSPACE/rust-toolchain.toml"

      - name: "Run on a project under that path toolchain"
        id: pathtc
        uses: $/
        with:
          path_prefix: rust-fixtures/path-toolchain
          include_environment: "true"

      - name: "Verify Rust outputs"
        shell: bash
        env:
          PROJECT_NAME: ${{ steps.project.outputs.rust_package_name }}
          PROJECT_PACKAGES: >-
            ${{ steps.project.outputs.rust_publishable_packages }}
          PROJECT_COUNT: >-
            ${{ steps.project.outputs.rust_publishable_package_count }}
          PROJECT_KIND: ${{ steps.project.outputs.rust_toolchain_kind }}
          WORKSPACE_PACKAGES: >-
            ${{ steps.workspace.outputs.rust_publishable_packages }}
          WORKSPACE_COUNT: >-
            ${{ steps.workspace.outputs.rust_publishable_package_count }}
          PATH_KIND: ${{ steps.pathtc.outputs.rust_toolchain_kind }}
          PATH_FILE: ${{ steps.pathtc.outputs.rust_toolchain_file }}
          PATH_CHANNEL: ${{ steps.pathtc.outputs.rust_toolchain_channel }}
          PATH_METADATA: ${{ steps.pathtc.outputs.metadata_json }}
        run: |
          set -euo pipefail
          fail=0
          check() {
            if [ "$2" = "$3" ]; then
              echo "✅ $1"
            else
              echo "::error::$1: got '$2', want '$3'"
              fail=1
            fi
          }

          check "test-rust-project package name" "$PROJECT_NAME" \
            "lfreleng-test-rust-project"
          check "test-rust-project publishable packages" \
            "$PROJECT_PACKAGES" \
            '[{"name":"lfreleng-test-rust-project","version":"0.1.0","manifest_path":"Cargo.toml"}]'
          check "test-rust-project publishable count" "$PROJECT_COUNT" "1"
          check "test-rust-project toolchain kind" "$PROJECT_KIND" "none"

          want="$(cat "$RUNNER_TEMP/workspace-packages.json")"
          check "workspace packages match cargo metadata" \
            "$WORKSPACE_PACKAGES" "$want"
          check "workspace publishable count" "$WORKSPACE_COUNT" \
            "$(jq length <<< "$want")"

          check "path toolchain kind" "$PATH_KIND" "path"
          check "path toolchain file" "$PATH_FILE" "../../rust-toolchain.toml"
          check "path toolchain channel" "$PATH_CHANNEL" ""
          marker="$GITHUB_WORKSPACE/marker-toolchain"
          if [ -e "$marker/EXECUTED" ]; then
            echo "::error::The action ran the project's path toolchain"
            fail=1
          else
            echo "✅ the action ran nothing from the path toolchain"
          fi
          if grep -qF -e "(marker)" -e "$marker" <<< "$PATH_METADATA"; then
            echo "::error::metadata_json carries the path toolchain"
            fail=1
          fi

          # Positive control: rustup does run the marker toolchain when
          # cargo starts in the workspace, so its absence above means
          # something
          version="$(cargo --version)"
          check "control: cargo in the workspace runs the marker" \
            "$version" "cargo 9.9.9 (marker)"
          if [ ! -e "$marker/EXECUTED" ]; then
            echo "::error::Control: the marker toolchain left no marker"
            fail=1
          fi
          exit "$fail"

  ### Python: a Poetry-only pyproject.toml with no [project] table ###
  test-python-poetry:
    name: "Test: Poetry-only Python project"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      # yamllint disable-line rule:line-length
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c  # v2.23.0
        with:
          egress-policy: audit

      - name: "Checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Generate Poetry fixture"
        shell: bash
        run: |
          set -euo pipefail
          project="$GITHUB_WORKSPACE/poetry-fixtures/poetry-only"
          mkdir -p "$project"
          cat > "$project/pyproject.toml" <<'TOML'
          [tool.poetry]
          name = "poetry-only-project"
          version = "1.2.3"

          [tool.poetry.dependencies]
          python = "^3.11"
          TOML

      - name: "Run on the Poetry fixture"
        id: poetry
        uses: $/
        with:
          path_prefix: poetry-fixtures/poetry-only
          python_offline_mode: "true"
          use_version_extract: "false"

      - name: "Verify Poetry outputs"
        shell: bash
        env:
          PROJECT_NAME: ${{ steps.poetry.outputs.project_name }}
          PROJECT_VERSION: ${{ steps.poetry.outputs.project_version }}
        run: |
          set -euo pipefail
          fail=0
          check() {
            if [ "$2" = "$3" ]; then
              echo "✅ $1"
            else
              echo "::error::$1: got '$2', want '$3'"
              fail=1
            fi
          }

          check "Poetry project_name" "$PROJECT_NAME" "poetry-only-project"
          check "Poetry project_version" "$PROJECT_VERSION" "1.2.3"
          exit "$fail"

  ### Python: the declared version, provider and setup.py reads ###
  test-python-versions:
    name: "Test: Python project versions"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      # yamllint disable-line rule:line-length
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c  # v2.23.0
        with:
          egress-policy: audit

      - name: "Checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Each fixture is its own git repository with one tag, v9.9.9,
      # so the fallback for a dynamic version is deterministic.
      - name: "Generate Python fixtures"
        shell: bash
        run: |
          set -euo pipefail
          root="$GITHUB_WORKSPACE/python-version-fixtures"

          mkdir -p "$root/scripts"
          cat > "$root/scripts/pyproject.toml" <<'TOML'
          [project.scripts]
          version = "pkg.cli:version"

          [project]
          name = "pkg"
          version = "4.5.6"
          TOML

          mkdir -p "$root/version-file"
          cat > "$root/version-file/pyproject.toml" <<'TOML'
          [build-system]
          requires = ["hatchling", "hatch-vcs"]
          build-backend = "hatchling.build"

          [project]
          name = "dyn-hook"
          dynamic = ["version"]

          [tool.hatch.build.hooks.vcs]
          version-file = "src/dyn_hook/_version.py"
          TOML

          mkdir -p "$root/setup-cfg"
          cat > "$root/setup-cfg/setup.cfg" <<'CFG'
          [metadata]
          name = cfg-static
          version = 1.2.3
          CFG

          mkdir -p "$root/scm"
          cat > "$root/scm/pyproject.toml" <<'TOML'
          [build-system]
          requires = ["setuptools>=64", "setuptools_scm[toml]>=8"]
          build-backend = "setuptools.build_meta"

          [project]
          name = "scm-project"
          dynamic = ["version"]
          TOML

          mkdir -p "$root/setup-py"
          cat > "$root/setup-py/setup.py" <<'PY'
          from setuptools import setup

          # setup(name="old-name", version="0.1")
          min_python_version = "3.9"
          setup(name="new-name", version="2.0.0")
          PY

          for dir in "$root"/*/; do
            git -C "$dir" init -q
            git -C "$dir" add -A
            git -C "$dir" -c user.name=Fixture \
              -c user.email=fixture@example.invalid \
              -c commit.gpgsign=false commit -q -m "Fixture"
            git -C "$dir" -c tag.gpgsign=false tag v9.9.9
          done

      - name: "Run on a version below a script named version"
        id: scripts
        uses: $/
        with:
          path_prefix: python-version-fixtures/scripts

      - name: "Run on a dynamic version with a version-file"
        id: vfile
        uses: $/
        with:
          path_prefix: python-version-fixtures/version-file

      - name: "Run on a setup.cfg static version"
        id: setup_cfg
        uses: $/
        with:
          path_prefix: python-version-fixtures/setup-cfg

      - name: "Run on a setuptools-scm dynamic version"
        id: scm
        uses: $/
        with:
          path_prefix: python-version-fixtures/scm

      - name: "Run on a setup.py with decoys"
        id: setup_py
        uses: $/
        with:
          path_prefix: python-version-fixtures/setup-py

      - name: "Verify Python version outputs"
        shell: bash
        env:
          SCRIPTS_VERSION: ${{ steps.scripts.outputs.project_version }}
          SCRIPTS_SOURCE: ${{ steps.scripts.outputs.version_source }}
          SCRIPTS_TYPE: ${{ steps.scripts.outputs.versioning_type }}
          SCRIPTS_PY_TYPE: ${{ steps.scripts.outputs.python_versioning_type }}
          VFILE_VERSION: ${{ steps.vfile.outputs.project_version }}
          VFILE_SOURCE: ${{ steps.vfile.outputs.version_source }}
          VFILE_TYPE: ${{ steps.vfile.outputs.versioning_type }}
          VFILE_PY_TYPE: ${{ steps.vfile.outputs.python_versioning_type }}
          VFILE_PROVIDER: ${{ steps.vfile.outputs.python_dynamic_provider }}
          CFG_VERSION: ${{ steps.setup_cfg.outputs.project_version }}
          CFG_SOURCE: ${{ steps.setup_cfg.outputs.version_source }}
          CFG_TYPE: ${{ steps.setup_cfg.outputs.versioning_type }}
          CFG_PY_TYPE: ${{ steps.setup_cfg.outputs.python_versioning_type }}
          SCM_VERSION: ${{ steps.scm.outputs.project_version }}
          SCM_SOURCE: ${{ steps.scm.outputs.version_source }}
          SCM_TYPE: ${{ steps.scm.outputs.versioning_type }}
          SCM_PROVIDER: ${{ steps.scm.outputs.python_dynamic_provider }}
          PY_NAME: ${{ steps.setup_py.outputs.project_name }}
          PY_VERSION: ${{ steps.setup_py.outputs.project_version }}
          PY_SOURCE: ${{ steps.setup_py.outputs.version_source }}
          PY_TYPE: ${{ steps.setup_py.outputs.versioning_type }}
        run: |
          set -euo pipefail
          fail=0
          check() {
            if [ "$2" = "$3" ]; then
              echo "✅ $1"
            else
              echo "::error::$1: got '$2', want '$3'"
              fail=1
            fi
          }

          check "scripts project_version" "$SCRIPTS_VERSION" "4.5.6"
          check "scripts version_source" "$SCRIPTS_SOURCE" "pyproject.toml"
          check "scripts versioning_type" "$SCRIPTS_TYPE" "static"
          check "scripts python_versioning_type" "$SCRIPTS_PY_TYPE" "static"

          check "version-file project_version" "$VFILE_VERSION" "9.9.9"
          check "version-file version_source" "$VFILE_SOURCE" "git-tag"
          check "version-file versioning_type" "$VFILE_TYPE" "dynamic"
          check "version-file python_versioning_type" \
            "$VFILE_PY_TYPE" "dynamic"
          check "version-file python_dynamic_provider" \
            "$VFILE_PROVIDER" "hatch-vcs"

          check "setup.cfg project_version" "$CFG_VERSION" "1.2.3"
          check "setup.cfg version_source" "$CFG_SOURCE" "setup.cfg"
          check "setup.cfg versioning_type" "$CFG_TYPE" "static"
          check "setup.cfg python_versioning_type" "$CFG_PY_TYPE" "static"

          check "scm project_version" "$SCM_VERSION" "9.9.9"
          check "scm version_source" "$SCM_SOURCE" "git-tag"
          check "scm versioning_type" "$SCM_TYPE" "dynamic"
          check "scm python_dynamic_provider" "$SCM_PROVIDER" "setuptools-scm"

          check "setup.py project_name" "$PY_NAME" "new-name"
          check "setup.py project_version" "$PY_VERSION" "2.0.0"
          check "setup.py version_source" "$PY_SOURCE" "setup.py"
          check "setup.py versioning_type" "$PY_TYPE" "static"
          exit "$fail"

  test-gradle-cargo-versions:
    name: "Test: Gradle and Cargo project versions"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      # yamllint disable-line rule:line-length
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c  # v2.23.0
        with:
          egress-policy: audit

      - name: "Checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Each fixture is its own git repository with one tag, v9.9.9,
      # so the fallback for a computed version is deterministic.
      - name: "Generate Gradle and Cargo fixtures"
        shell: bash
        run: |
          set -euo pipefail
          root="$GITHUB_WORKSPACE/gradle-cargo-version-fixtures"

          mkdir -p "$root/g1"
          cat > "$root/g1/build.gradle" <<'GRADLE'
          version '1.2.3'
          GRADLE

          mkdir -p "$root/g4"
          cat > "$root/g4/build.gradle" <<'GRADLE'
          ext {
              versionJunit = "5.10.0"
          }
          version = "2.1.0"
          GRADLE

          mkdir -p "$root/g7"
          cat > "$root/g7/build.gradle" <<'GRADLE'
          plugins {
              id 'org.springframework.boot' version '3.2.0'
          }
          version = '2.1.0'
          GRADLE

          mkdir -p "$root/g13"
          cat > "$root/g13/build.gradle" <<'GRADLE'
          version = rootProject.version
          GRADLE

          mkdir -p "$root/g16"
          cat > "$root/g16/build.gradle" <<'GRADLE'
          plugins {
              id 'java'
          }
          GRADLE
          cat > "$root/g16/gradle.properties" <<'PROPS'
          version=1.2.3
          PROPS

          mkdir -p "$root/c1"
          cat > "$root/c1/Cargo.toml" <<'TOML'
          [package]
          name = "c1"
          version = "1.2.3" # bump on release
          TOML

          mkdir -p "$root/c2"
          cat > "$root/c2/Cargo.toml" <<'TOML'
          [package]
          name = "c2"
          version = { workspace = true }

          [workspace]

          [workspace.package]
          version = "1.2.3"
          TOML

          mkdir -p "$root/c6"
          cat > "$root/c6/Cargo.toml" <<'TOML'
          [workspace]
          members = []

          [workspace.package]
          version = "1.2.3"
          TOML

          for dir in "$root"/*/; do
            git -C "$dir" init -q
            git -C "$dir" add -A
            git -C "$dir" -c user.name=Fixture \
              -c user.email=fixture@example.invalid \
              -c commit.gpgsign=false commit -q -m "Fixture"
            git -C "$dir" -c tag.gpgsign=false tag v9.9.9
          done

      - name: "Run on a Groovy command-form version"
        id: g1
        uses: $/
        with:
          path_prefix: gradle-cargo-version-fixtures/g1

      - name: "Run on a version below versionJunit"
        id: g4
        uses: $/
        with:
          path_prefix: gradle-cargo-version-fixtures/g4

      - name: "Run on a version below a plugin version, no extract"
        id: g7
        uses: $/
        with:
          path_prefix: gradle-cargo-version-fixtures/g7
          use_version_extract: "false"

      - name: "Run on a computed Gradle version"
        id: g13
        uses: $/
        with:
          path_prefix: gradle-cargo-version-fixtures/g13

      - name: "Run on a gradle.properties version"
        id: g16
        uses: $/
        with:
          path_prefix: gradle-cargo-version-fixtures/g16

      - name: "Run on a Cargo version with a trailing comment"
        id: c1
        uses: $/
        with:
          path_prefix: gradle-cargo-version-fixtures/c1

      - name: "Run on an inherited Cargo version"
        id: c2
        uses: $/
        with:
          path_prefix: gradle-cargo-version-fixtures/c2

      - name: "Run on a virtual Cargo workspace"
        id: c6
        uses: $/
        with:
          path_prefix: gradle-cargo-version-fixtures/c6

      - name: "Verify Gradle and Cargo version outputs"
        shell: bash
        env:
          G1_VERSION: ${{ steps.g1.outputs.project_version }}
          G1_SOURCE: ${{ steps.g1.outputs.version_source }}
          G1_TYPE: ${{ steps.g1.outputs.versioning_type }}
          G4_VERSION: ${{ steps.g4.outputs.project_version }}
          G4_SOURCE: ${{ steps.g4.outputs.version_source }}
          G4_TYPE: ${{ steps.g4.outputs.versioning_type }}
          G7_VERSION: ${{ steps.g7.outputs.project_version }}
          G7_SOURCE: ${{ steps.g7.outputs.version_source }}
          G7_TYPE: ${{ steps.g7.outputs.versioning_type }}
          G13_VERSION: ${{ steps.g13.outputs.project_version }}
          G13_SOURCE: ${{ steps.g13.outputs.version_source }}
          G13_TYPE: ${{ steps.g13.outputs.versioning_type }}
          G16_VERSION: ${{ steps.g16.outputs.project_version }}
          G16_SOURCE: ${{ steps.g16.outputs.version_source }}
          G16_TYPE: ${{ steps.g16.outputs.versioning_type }}
          C1_VERSION: ${{ steps.c1.outputs.project_version }}
          C1_SOURCE: ${{ steps.c1.outputs.version_source }}
          C1_TYPE: ${{ steps.c1.outputs.versioning_type }}
          C2_VERSION: ${{ steps.c2.outputs.project_version }}
          C2_SOURCE: ${{ steps.c2.outputs.version_source }}
          C2_TYPE: ${{ steps.c2.outputs.versioning_type }}
          C6_VERSION: ${{ steps.c6.outputs.project_version }}
          C6_SOURCE: ${{ steps.c6.outputs.version_source }}
          C6_TYPE: ${{ steps.c6.outputs.versioning_type }}
        run: |
          set -euo pipefail
          fail=0
          check() {
            if [ "$2" = "$3" ]; then
              echo "✅ $1"
            else
              echo "::error::$1: got '$2', want '$3'"
              fail=1
            fi
          }

          check "G1 project_version" "$G1_VERSION" "1.2.3"
          check "G1 version_source" "$G1_SOURCE" "build.gradle"
          check "G1 versioning_type" "$G1_TYPE" "static"

          check "G4 project_version" "$G4_VERSION" "2.1.0"
          check "G4 version_source" "$G4_SOURCE" "build.gradle"
          check "G4 versioning_type" "$G4_TYPE" "static"

          check "G7 project_version" "$G7_VERSION" "2.1.0"
          check "G7 version_source" "$G7_SOURCE" "build.gradle"
          check "G7 versioning_type" "$G7_TYPE" "static"

          check "G13 project_version" "$G13_VERSION" "9.9.9"
          check "G13 version_source" "$G13_SOURCE" "git-tag"
          check "G13 versioning_type" "$G13_TYPE" "dynamic"

          check "G16 project_version" "$G16_VERSION" "1.2.3"
          check "G16 version_source" "$G16_SOURCE" "gradle.properties"
          check "G16 versioning_type" "$G16_TYPE" "static"

          check "C1 project_version" "$C1_VERSION" "1.2.3"
          check "C1 version_source" "$C1_SOURCE" "Cargo.toml"
          check "C1 versioning_type" "$C1_TYPE" "static"

          check "C2 project_version" "$C2_VERSION" "1.2.3"
          check "C2 version_source" "$C2_SOURCE" "Cargo.toml"
          check "C2 versioning_type" "$C2_TYPE" "static"

          check "C6 project_version" "$C6_VERSION" "1.2.3"
          check "C6 version_source" "$C6_SOURCE" "Cargo.toml"
          check "C6 versioning_type" "$C6_TYPE" "static"
          exit "$fail"

  ### Version metadata on pinned Linux Foundation projects ###
  test-lf-projects:
    name: "Test: ${{ matrix.repository }}"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    strategy:
      fail-fast: false
      # Pinned commits keep the expectations deterministic; refreshing
      # a pin is a deliberate change. An empty project_version or
      # version_source is not asserted.
      matrix:
        include:
          - repository: onap/cps
            ref: a0bc7132af6eb60fa10c5d2dd9b7bfcf74ced096
            subdir: ""
            props_version: "3.8.6"
            props_match: "true"
            project_version: ""
            version_source: ""
          - repository: o-ran-sc/oam-nf-oam-adopter
            ref: 6aa71050e852b43041dabe7984bd2a0eb5dc7844
            subdir: ""
            props_version: "1.0.0"
            props_match: "true"
            project_version: "1.0.0"
            version_source: "version.properties"
          - repository: onap/aai-resources
            ref: 486cc02ece4813f8dd8e012f94f265c7ee97e173
            subdir: ""
            props_version: "2.0.0"
            props_match: "true"
            project_version: ""
            version_source: ""
          - repository: onap/ccsdk-parent
            ref: c5d8bf5bdc66204644154acfd4e9168ceabaf3ff
            subdir: ""
            props_version: "3.3.4"
            props_match: "true"
            project_version: ""
            version_source: ""
          - repository: onap/so-libs
            ref: b89495771af6f91621c16f970437d840bfde43d1
            subdir: ""
            props_version: "1.13.0"
            props_match: "true"
            project_version: ""
            version_source: ""
          # parents/version.properties (2.7.0) has drifted from
          # parents/pom.xml (14.0.1-SNAPSHOT) at this commit, so the
          # match is genuinely false
          - repository: o-ran-sc/oam-oam-controller
            ref: 143f0ad18dbf25e1e172a2772b0a4c3f0c30c97d
            subdir: "/parents"
            props_version: "2.7.0"
            props_match: "false"
            project_version: "14.0.1-SNAPSHOT"
            version_source: "pom.xml"
          - repository: opendaylight/odlparent
            ref: b381176b10992ba7a558030d3f2331f08cb070b4
            subdir: ""
            props_version: ""
            props_match: ""
            project_version: "15.1.1-SNAPSHOT"
            version_source: "pom.xml"
          - repository: opendaylight/mdsal
            ref: 4894e54fdb9b5f0a47e2cd6c9a8251b2148c78be
            subdir: ""
            props_version: ""
            props_match: ""
            project_version: "17.0.3-SNAPSHOT"
            version_source: "pom.xml"
    steps:
      # yamllint disable-line rule:line-length
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c  # v2.23.0
        with:
          egress-policy: audit

      - name: "Checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Checkout ${{ matrix.repository }}"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.ref }}
          path: lf-project
          persist-credentials: false

      - name: "Run on ${{ matrix.repository }}"
        id: project
        uses: $/
        with:
          path_prefix: lf-project${{ matrix.subdir }}

      - name: "Verify version outputs"
        shell: bash
        env:
          REPOSITORY: ${{ matrix.repository }}
          GOT_PROPS_VERSION: >-
            ${{ steps.project.outputs.version_properties_version }}
          GOT_PROPS_MATCH: ${{ steps.project.outputs.version_properties_match }}
          GOT_PROJECT_VERSION: ${{ steps.project.outputs.project_version }}
          GOT_VERSION_SOURCE: ${{ steps.project.outputs.version_source }}
          WANT_PROPS_VERSION: ${{ matrix.props_version }}
          WANT_PROPS_MATCH: ${{ matrix.props_match }}
          WANT_PROJECT_VERSION: ${{ matrix.project_version }}
          WANT_VERSION_SOURCE: ${{ matrix.version_source }}
        run: |
          set -euo pipefail
          fail=0
          check() {
            if [ "$2" = "$3" ]; then
              echo "✅ $1"
            else
              echo "::error::$1: got '$2', want '$3'"
              fail=1
            fi
          }

          check "$REPOSITORY version_properties_version" \
            "$GOT_PROPS_VERSION" "$WANT_PROPS_VERSION"
          check "$REPOSITORY version_properties_match" \
            "$GOT_PROPS_MATCH" "$WANT_PROPS_MATCH"
          if [ -n "$WANT_PROJECT_VERSION" ]; then
            check "$REPOSITORY project_version" \
              "$GOT_PROJECT_VERSION" "$WANT_PROJECT_VERSION"
          fi
          if [ -n "$WANT_VERSION_SOURCE" ]; then
            check "$REPOSITORY version_source" \
              "$GOT_VERSION_SOURCE" "$WANT_VERSION_SOURCE"
          fi
          exit "$fail"

  ### Go module download: retry a transient proxy error, then stop ###
  test-go-download-retry:
    name: "Test: Go module download retry"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      # yamllint disable-line rule:line-length
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c  # v2.23.0
        with:
          egress-policy: audit

      - name: "Checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A local module proxy that answers the first module request with
      # a 500, then redirects every later one to proxy.golang.org,
      # logging the status it gave each module request.
      - name: "Start flaky module proxy"
        shell: bash
        run: |
          set -euo pipefail
          proxy_dir="$RUNNER_TEMP/flaky-proxy"
          mkdir -p "$proxy_dir"
          cat > "$proxy_dir/proxy.py" <<'PY'
          import http.server
          import sys
          import threading

          lock = threading.Lock()
          state = {"failed": False}
          log = open(sys.argv[2], "a", encoding="utf-8")


          class Handler(http.server.BaseHTTPRequestHandler):
              def do_GET(self):
                  # Readiness probes do not touch the failure state
                  if "/@v/" not in self.path:
                      self.send_response(200)
                      self.end_headers()
                      return
                  with lock:
                      fail = not state["failed"]
                      state["failed"] = True
                      log.write(f"{500 if fail else 302} {self.path}\n")
                      log.flush()
                  if fail:
                      self.send_error(500, "simulated proxy failure")
                      return
                  self.send_response(302)
                  self.send_header(
                      "Location", "https://proxy.golang.org" + self.path
                  )
                  self.end_headers()

              def log_message(self, *args):
                  pass


          http.server.ThreadingHTTPServer(
              ("127.0.0.1", int(sys.argv[1])), Handler
          ).serve_forever()
          PY
          nohup python3 "$proxy_dir/proxy.py" 8765 "$proxy_dir/requests.log" \
            > "$proxy_dir/server.log" 2>&1 &
          for _ in $(seq 1 20); do
            if curl -s -o /dev/null http://127.0.0.1:8765/; then
              exit 0
            fi
            sleep 0.5
          done
          echo "::error::Flaky module proxy did not start"
          cat "$proxy_dir/server.log"
          exit 1

      # Each case uses an empty module cache so the download must fetch.
      - name: "Run with one transient proxy failure"
        id: flaky
        continue-on-error: true
        uses: $/
        env:
          GOPROXY: "http://127.0.0.1:8765"
          GOMODCACHE: ${{ runner.temp }}/modcache-flaky

      - name: "Run with the module proxy down"
        id: down
        continue-on-error: true
        uses: $/
        env:
          # Nothing listens on the discard port, so every attempt fails
          GOPROXY: "http://127.0.0.1:9"
          GOMODCACHE: ${{ runner.temp }}/modcache-down

      - name: "Verify retry and exhaustion"
        shell: bash
        env:
          FLAKY_OUTCOME: ${{ steps.flaky.outcome }}
          FLAKY_SUCCESS: ${{ steps.flaky.outputs.success }}
          DOWN_OUTCOME: ${{ steps.down.outcome }}
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/flaky-proxy/requests.log"
          fail=0
          check() {
            if [ "$2" = "$3" ]; then
              echo "✅ $1"
            else
              echo "::error::$1: got '$2', want '$3'"
              fail=1
            fi
          }

          failures="$(grep -c '^500 ' "$log" || true)"
          redirects="$(grep -c '^302 ' "$log" || true)"
          check "Proxy failed one request" "$failures" "1"
          check "Download retried after the failure" \
            "$([ "$redirects" -gt 0 ] && echo yes || echo no)" "yes"
          check "Transient failure: action outcome" \
            "$FLAKY_OUTCOME" "success"
          check "Transient failure: success output" \
            "$FLAKY_SUCCESS" "true"
          check "Proxy down: action outcome" "$DOWN_OUTCOME" "failure"
          exit "$fail"

  ### Summary Job ###
  test-summary:
    name: "Test Summary"
    runs-on: ubuntu-latest
    needs:
      - test-self
      - test-matrix
      - test-rust
      - test-python-poetry
      - test-python-versions
      - test-gradle-cargo-versions
      - test-lf-projects
      - test-go-download-retry
    if: always()
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - name: "Generate Test Summary"
        shell: bash
        env:
          # Env-mediated to avoid template expansion in the run block
          SELF_TEST: ${{ needs.test-self.result }}
          MATRIX_TEST: ${{ needs.test-matrix.result }}
          RUST_TEST: ${{ needs.test-rust.result }}
          POETRY_TEST: ${{ needs.test-python-poetry.result }}
          PY_VERSIONS_TEST: ${{ needs.test-python-versions.result }}
          GRADLE_CARGO_TEST: ${{ needs.test-gradle-cargo-versions.result }}
          LF_TEST: ${{ needs.test-lf-projects.result }}
          GO_DOWNLOAD_TEST: ${{ needs.test-go-download-retry.result }}
        run: |
          # Count tests by checking job results

          {
            echo "# 🧪 Build Metadata Action Test Results"
            echo ""
            echo "## Overview"
            echo ""
            echo "| Job | Status |"
            echo "|-----|--------|"

            if [ "$SELF_TEST" = "success" ]; then
              echo "| Self Test (Go) | ✅ Passed |"
            else
              echo "| Self Test (Go) | ❌ Failed |"
            fi

            if [ "$MATRIX_TEST" = "success" ]; then
              echo "| Matrix Tests (54 projects) | ✅ Passed |"
            else
              echo "| Matrix Tests (54 projects) |" \
                "⚠️  Completed with warnings |"
            fi

            if [ "$RUST_TEST" = "success" ]; then
              echo "| Rust Metadata | ✅ Passed |"
            else
              echo "| Rust Metadata | ❌ Failed |"
            fi

            if [ "$POETRY_TEST" = "success" ]; then
              echo "| Poetry-only Python | ✅ Passed |"
            else
              echo "| Poetry-only Python | ❌ Failed |"
            fi

            if [ "$PY_VERSIONS_TEST" = "success" ]; then
              echo "| Python Project Versions | ✅ Passed |"
            else
              echo "| Python Project Versions | ❌ Failed |"
            fi

            if [ "$GRADLE_CARGO_TEST" = "success" ]; then
              echo "| Gradle and Cargo Project Versions | ✅ Passed |"
            else
              echo "| Gradle and Cargo Project Versions | ❌ Failed |"
            fi

            if [ "$LF_TEST" = "success" ]; then
              echo "| LF Project Versions | ✅ Passed |"
            else
              echo "| LF Project Versions | ❌ Failed |"
            fi

            if [ "$GO_DOWNLOAD_TEST" = "success" ]; then
              echo "| Go Module Download Retry | ✅ Passed |"
            else
              echo "| Go Module Download Retry | ❌ Failed |"
            fi

            echo ""
            echo "## Test Coverage"
            echo ""
            echo "Tested against 54 real-world projects:"
            echo ""
            echo "- 🐍 Python: 3 projects"
            echo "- 📦 JavaScript/TypeScript: 6 projects"
            echo "- 🐹 Go: 3 projects"
            echo "- 🦀 Rust: 3 projects"
            echo "- ☕ Java (Maven/Gradle): 6 projects"
            echo "- 💎 Ruby: 3 projects"
            echo "- 🐘 PHP: 3 projects"
            echo "- 🔷 C# / .NET: 3 projects"
            echo "- 🍎 Swift: 3 projects"
            echo "- 🎯 Dart: 3 projects"
            echo "- 🐳 Docker: 3 projects"
            echo "- ⎈ Helm: 3 projects"
            echo "- 🏗️ Terraform: 3 projects"
            echo "- ⚙️ C/C++: 3 projects"
            echo "- 📊 Scala: 3 projects"
            echo "- 💧 Elixir: 3 projects"
            echo "- λ Haskell: 3 projects"
            echo "- 🔬 Julia: 3 projects"
            echo ""

            if [ "$MATRIX_TEST" != "success" ]; then
              echo "## ⚠️ Warnings"
              echo ""
              echo "Some tests completed with warnings." \
                "This is expected for:"
              echo "- Project types with extractors not yet" \
                "fully implemented"
              echo "- Complex monorepo structures"
              echo "- Projects with non-standard configurations"
              echo ""
              echo "Check individual test logs for details."
            fi

            echo ""
            echo "---"
            echo ""
            echo "**Note**: All tests use real-world open source" \
              "projects"
            echo "to ensure the action works with actual codebases," \
              "not just"
            echo "synthetic test cases."
          } >> "$GITHUB_STEP_SUMMARY"
