# Exercises every key the Rust extractor reports, so tests can check the
# outputs action.yaml declares against those the binary writes.

[package]
name = "complete-demo"
version = "1.4.2"
edition = "2021"
rust-version = "1.80"
description = "Fixture covering every reported Cargo.toml field"
documentation = "https://docs.example.com/complete-demo"
homepage = "https://example.com"
repository = "https://github.com/example/complete-demo"
license = "Apache-2.0"
license-file = "LICENSE"
readme = "README.md"
keywords = ["fixture", "metadata"]
categories = ["development-tools"]
publish = ["internal-registry"]
build = "build.rs"

[lib]
name = "complete_demo"
crate-type = ["lib", "cdylib"]

[[bin]]
name = "complete-demo"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1", optional = true }

[dev-dependencies]
tempfile = "3"

[build-dependencies]
cc = "1"

[features]
default = []
async = ["dep:tokio"]

[workspace]
members = ["."]
resolver = "2"
