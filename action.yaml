---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2025 The Linux Foundation

name: "Build Metadata Action"
description: >-
  Universal action to capture, validate, and display comprehensive metadata
  for project builds across multiple languages and build systems
author: "The Linux Foundation"

branding:
  icon: "package"
  color: "blue"

inputs:
  path_prefix:
    description: "Path to the project root directory"
    required: false
    default: "."

  project_type:
    description: >-
      Declare the project type instead of detecting it (for example
      java-maven or java-gradle). Empty auto-detects.
    required: false
    default: ""

  output_format:
    # Can be provided comma-separated, space-separated or newline-separated
    # Set to an empty string to disable output
    description: "Output format: summary, json, markdown, yaml"
    required: false
    default: "summary"

  include_environment:
    description: "Collect and include environment metadata"
    required: false
    default: "true"

  use_version_extract:
    description: "Use version-extract-action for version detection if available"
    required: false
    default: "true"

  verbose:
    description: "Enable verbose logging output"
    required: false
    default: "false"

  # Artifact Upload Configuration
  artifact_upload:
    description: "Upload gathered metadata as workflow artifacts"
    required: false
    default: "true"

  artifact_name_prefix:
    description: "Custom prefix for artifact names"
    required: false
    default: "build-metadata"

  artifact_formats:
    description: "Comma-separated list of formats to upload (json, yaml)"
    required: false
    default: "json"

  validate_output:
    description: "Validate JSON/YAML output before uploading"
    required: false
    default: "true"

  strict_validation:
    description: "Use strict validation mode (round-trip testing)"
    required: false
    default: "true"

  export_env_vars:
    description: "Export action outputs as variables for subsequent steps"
    required: false
    default: "false"

  # ===================================================================
  # Python-specific inputs (consumed by the Python extractor only)
  # ===================================================================
  python_offline_mode:
    description: >-
      When 'true', the Python extractor skips the live endoflife.date
      consultation and uses the action's static supported-version list
      (3.10 through 3.14 at the time of writing). Useful for hermetic
      builds or when the runner has no outbound network access. Default
      'false' so the extractor benefits from live EOL data.
    required: false
    default: "false"

  python_eol_timeout:
    description: "endoflife.date HTTP timeout in seconds (online mode only)"
    required: false
    default: "5"

  python_eol_max_retries:
    description: >-
      endoflife.date HTTP retry budget (online mode only). Set to '0'
      to opt out of retries entirely (a single attempt with no retry
      on failure). Values are integers; negative values are treated
      as the documented default ('2').
    required: false
    default: "2"

outputs:
  # Complete Metadata Outputs
  metadata_json:
    description: "Complete metadata as JSON string"
    value: ${{ steps.extract.outputs.metadata_json }}

  metadata_yaml:
    description: "Complete metadata as YAML string"
    value: ${{ steps.extract.outputs.metadata_yaml }}

  markdown_output:
    description: "Markdown formatted metadata"
    value: ${{ steps.extract.outputs.markdown_output }}

  # Artifact Outputs
  artifact_name:
    description: "Name of the uploaded artifact"
    value: ${{ steps.extract.outputs.artifact_name }}

  artifact_path:
    description: "Path to artifact directory"
    value: ${{ steps.extract.outputs.artifact_path }}

  artifact_files:
    description: "Comma-separated list of artifact files"
    value: ${{ steps.extract.outputs.artifact_files }}

  # Common Project Metadata
  project_type:
    description: >-
      Resolved project type, either detected or supplied through the
      project_type input (e.g. python-modern, javascript-npm)
    value: ${{ steps.extract.outputs.project_type }}

  build_tool:
    # Empty where the project type does not name a tool unambiguously,
    # so a consumer can distinguish "not identified" from a wrong guess.
    # Python is deliberately absent: its tool is a build backend, already
    # reported as python_build_backend.
    description: >-
      Build tool implied by the project type (maven, gradle, npm, yarn,
      pnpm, go, cargo, bundler, composer, swiftpm, helm, docker,
      terraform, opentofu, cmake, autoconf); empty when not identified
    value: ${{ steps.extract.outputs.build_tool }}

  project_name:
    description: "Project name"
    value: ${{ steps.extract.outputs.project_name }}

  project_version:
    description: "Project version"
    value: ${{ steps.extract.outputs.project_version }}

  project_path:
    description: "Absolute path to project"
    value: ${{ steps.extract.outputs.project_path }}

  version_source:
    description: "Source file where version was found"
    value: ${{ steps.extract.outputs.version_source }}

  version_properties_version:
    description: "Version parsed from version.properties; empty when absent"
    value: ${{ steps.extract.outputs.version_properties_version }}

  version_properties_match:
    description: >-
      Whether version.properties matches project_version
      (true/false; empty when not comparable)
    value: ${{ steps.extract.outputs.version_properties_match }}

  snapshot_version:
    description: "Synthesized interim version (X.Y.Z-SNAPSHOT convention)"
    value: ${{ steps.extract.outputs.snapshot_version }}

  release_files:
    description: >-
      Comma-separated release request files under releases/ (global-jjb /
      LF release convention); empty when none are present
    value: ${{ steps.extract.outputs.release_files }}

  release_file_count:
    description: "Number of release request files found under releases/"
    value: ${{ steps.extract.outputs.release_file_count }}

  is_release_ready:
    description: >-
      Returns true when at least one release request file is present under
      releases/. This describes the tree, not the commit: a repository that
      has ever released keeps its release files, so it stays true. Whether a
      given commit adds a release file needs the commit's diff.
    value: ${{ steps.extract.outputs.is_release_ready }}

  release_version:
    description: >-
      Version parsed from a lone release file; empty when several exist
      (the caller disambiguates via changed files). Container release files
      carry it as container_release_tag, other types as version.
    value: ${{ steps.extract.outputs.release_version }}

  release_ref:
    description: >-
      Git ref parsed from a lone release file; empty when several exist
    value: ${{ steps.extract.outputs.release_ref }}

  release_distribution_type:
    description: >-
      distribution_type of a lone release file, lowercased (maven, container,
      artifact, pypi); empty when it declares none or several files exist
    value: ${{ steps.extract.outputs.release_distribution_type }}

  versioning_type:
    description: "Versioning type: 'static' or 'dynamic'"
    value: ${{ steps.extract.outputs.versioning_type }}

  build_timestamp:
    description: "Build timestamp (ISO 8601)"
    value: ${{ steps.extract.outputs.build_timestamp }}

  # Git Information
  git_sha:
    description: "Git commit SHA"
    value: ${{ steps.extract.outputs.git_sha }}

  git_branch:
    description: "Git branch name"
    value: ${{ steps.extract.outputs.git_branch }}

  git_tag:
    description: "Git tag (if on a tag)"
    value: ${{ steps.extract.outputs.git_tag }}

  # CI/Build Information
  ci_platform:
    description: "CI platform (github, gitlab, circleci, etc.)"
    value: ${{ steps.extract.outputs.ci_platform }}

  ci_run_id:
    description: "CI run ID"
    value: ${{ steps.extract.outputs.ci_run_id }}

  ci_run_url:
    description: "CI run URL"
    value: ${{ steps.extract.outputs.ci_run_url }}

  runner_os:
    description: "Runner operating system"
    value: ${{ steps.extract.outputs.runner_os }}

  runner_arch:
    description: "Runner architecture"
    value: ${{ steps.extract.outputs.runner_arch }}

  # Language-Specific Outputs (Python)
  python_package_name:
    description: "Python package name"
    value: ${{ steps.extract.outputs.python_package_name }}

  python_requires_python:
    description: "Required Python version"
    value: ${{ steps.extract.outputs.python_requires_python }}

  python_build_backend:
    description: "Python build backend"
    value: ${{ steps.extract.outputs.python_build_backend }}

  python_metadata_source:
    description: "Source of Python metadata (pyproject.toml, setup.py, etc.)"
    value: ${{ steps.extract.outputs.python_metadata_source }}

  python_versioning_type:
    description: "Python versioning type: 'static' or 'dynamic'"
    value: ${{ steps.extract.outputs.python_versioning_type }}

  python_matrix_json:
    description: "Python version matrix as JSON"
    value: ${{ steps.extract.outputs.python_matrix_json }}

  python_build_version:
    description: "Recommended Python version for building (latest from matrix)"
    value: ${{ steps.extract.outputs.python_build_version }}

  python_dynamic_provider:
    description: >-
      When versioning_type is dynamic, identifies the provider responsible
      for resolving the version at build time (pbr, setuptools-scm,
      versioneer, setuptools-dynamic, runtime-attr).
    value: ${{ steps.extract.outputs.python_dynamic_provider }}

  python_requires_python_fallback:
    description: >-
      true when the action could not determine a Python version from the
      project metadata and resorted to the canonical default matrix.
      Consumers should surface this as a warning to the user.
    value: ${{ steps.extract.outputs.python_requires_python_fallback }}

  python_requires_python_source:
    description: >-
      Source from which the supported-Python-version list was derived.
      One of:
        "requires-python" - derived from [project].requires-python
          (pyproject) or python_requires (setup.cfg / setup.py);
        "classifiers" - derived from PEP 301 trove classifiers;
        "poetry-dependencies" - derived from
          [tool.poetry.dependencies].python in pyproject.toml;
        "static-fallback" - no version signal was found and the action
          fell back to its hard-coded supported set;
        "out-of-range-fallback" - the constraint parsed cleanly but
          matched no Python version supported by this action (e.g.
          requires-python = ">=4.0"); the action widened the matrix to
          the supported set so the workflow could proceed and emitted a
          ::warning:: plus a $GITHUB_STEP_SUMMARY entry;
        "parse-error-fallback" - the constraint failed to parse (e.g.
          a malformed PEP 440 specifier); the action widened the matrix
          to the supported set as a defensive fallback and emitted a
          ::warning:: so the user sees the parse failure;
        empty - the extractor was not invoked (non-Python project).
    value: ${{ steps.extract.outputs.python_requires_python_source }}

  python_version_unresolved:
    description: >-
      true when the project version is dynamic but cannot be resolved
      without a build-time signal (e.g. PBR without a tag or PBR_VERSION).
    value: ${{ steps.extract.outputs.python_version_unresolved }}

  python_dependencies_source:
    description: >-
      Source from which the dependency list was loaded (typically
      "requirements.txt" for projects that delegate install_requires).
    value: ${{ steps.extract.outputs.python_dependencies_source }}

  python_eol_versions:
    description: >-
      Space-separated list of Python versions in the resolved matrix
      that the live endoflife.date API marks as end-of-life. Versions
      below the action's baseline floor (see pyversions.Baseline()) can
      never appear here because they are not in the supported set in
      the first place; this output surfaces matrix versions that have
      reached EOL since they entered the supported set. Empty when
      offline mode is selected, when the live API is unreachable, or
      when no EOL version intersects the matrix. Consumers (typically
      python-build-action) can branch on this to warn, strip, or fail
      their own build steps.
    value: ${{ steps.extract.outputs.python_eol_versions }}

  python_eol_versions_present:
    description: >-
      "true" when python_eol_versions is non-empty (one or more EOL
      versions are in the resolved matrix); "false" otherwise. Provided
      as a stable boolean for workflow `if:` predicates so consumers do
      not need to test the string for emptiness. Empty (not "false")
      when the Python extractor is not invoked -- e.g. for non-Python
      projects -- because `cmd/build-metadata/main.go` only emits
      `python_*` outputs for the detected language. Consumers running
      against mixed-language repos should therefore default to
      treating an empty value as "no EOL hits".
    value: ${{ steps.extract.outputs.python_eol_versions_present }}

  python_project_match_package:
    description: "Whether Python project name matches package name"
    value: ${{ steps.extract.outputs.python_project_match_package }}

  # Common Comparison Outputs
  project_match_repo:
    description: "Whether project name matches repository name"
    value: ${{ steps.extract.outputs.project_match_repo }}

  # Language-Specific Outputs (JavaScript)
  javascript_package_name:
    description: "JavaScript package name"
    value: ${{ steps.extract.outputs.javascript_package_name }}

  javascript_package_manager:
    description: "Detected package manager (npm, yarn, pnpm, bun)"
    value: ${{ steps.extract.outputs.javascript_package_manager }}

  javascript_lock_file:
    description: "Lock file name"
    value: ${{ steps.extract.outputs.javascript_lock_file }}

  javascript_has_lock_file:
    description: "Whether lock file exists"
    value: ${{ steps.extract.outputs.javascript_has_lock_file }}

  javascript_module_type:
    description: "Module type (module, commonjs)"
    value: ${{ steps.extract.outputs.javascript_module_type }}

  javascript_requires_node:
    description: "Required Node.js version"
    value: ${{ steps.extract.outputs.javascript_requires_node }}

  javascript_is_workspace:
    description: "Whether project is a workspace/monorepo"
    value: ${{ steps.extract.outputs.javascript_is_workspace }}

  javascript_has_typescript:
    description: "Whether project uses TypeScript"
    value: ${{ steps.extract.outputs.javascript_has_typescript }}

  # Language-Specific Outputs (Java/Maven)
  java_group_id:
    description: "Java/Maven group ID"
    value: ${{ steps.extract.outputs.java_group_id }}

  java_artifact_id:
    description: "Java/Maven artifact ID"
    value: ${{ steps.extract.outputs.java_artifact_id }}

  java_packaging:
    description: "Java/Maven packaging type (jar, war, pom, etc.)"
    value: ${{ steps.extract.outputs.java_packaging }}

  java_metadata_source:
    description: "Source of Java metadata (pom.xml, build.gradle, etc.)"
    value: ${{ steps.extract.outputs.java_metadata_source }}

  java_has_parent:
    description: "Whether Maven project has a parent POM"
    value: ${{ steps.extract.outputs.java_has_parent }}

  java_is_multi_module:
    description: "Whether Maven project is multi-module"
    value: ${{ steps.extract.outputs.java_is_multi_module }}

  java_module_count:
    description: "Number of Maven modules"
    value: ${{ steps.extract.outputs.java_module_count }}

  java_build_dsl:
    description: "Gradle build DSL (groovy or kotlin)"
    value: ${{ steps.extract.outputs.java_build_dsl }}

  java_is_multi_project:
    description: "Whether Gradle project is multi-project"
    value: ${{ steps.extract.outputs.java_is_multi_project }}

  java_gradle_version:
    description: >-
      Gradle version the wrapper declares. Empty when the project has no
      wrapper, or when distributionUrl names no recognisable version.
      This is what the project asks to build with, which differs from the
      version a CI step provisioned.
    value: ${{ steps.extract.outputs.java_gradle_version }}

  java_gradle_version_source:
    description: "Where the Gradle version was detected; empty when absent"
    value: ${{ steps.extract.outputs.java_gradle_version_source }}

  java_version:
    description: "Required Java version"
    value: ${{ steps.extract.outputs.java_version }}

  java_version_source:
    description: >-
      Where the Java version was detected (e.g. maven.compiler.release,
      maven-compiler-plugin/release, module:<name>, toolchain)
    value: ${{ steps.extract.outputs.java_version_source }}

  java_frameworks:
    description: "Detected Java frameworks (Spring Boot, Quarkus, etc.)"
    value: ${{ steps.extract.outputs.java_frameworks }}

  java_source_dirs:
    # Module-relative, so a consumer can apply them per module across a
    # reactor. Falls back to Maven's convention when <build> is silent,
    # because that is what the build itself will use.
    description: >-
      Comma-separated main source directories, module-relative
      (default src/main/java)
    value: ${{ steps.extract.outputs.java_source_dirs }}

  java_test_source_dirs:
    description: >-
      Comma-separated test source directories, module-relative
      (default src/test/java)
    value: ${{ steps.extract.outputs.java_test_source_dirs }}

  java_coverage_tool:
    description: >-
      Coverage tool configured in the build ('jacoco'); empty when none
      is configured
    value: ${{ steps.extract.outputs.java_coverage_tool }}

  java_coverage_report_paths:
    # Emitted only when a coverage tool is configured. Absent is a
    # meaningful answer: pointing a scanner at a report that is never
    # produced is worse than telling it there is none.
    description: >-
      Comma-separated coverage report locations, module-relative; empty
      when the build configures no coverage tool
    value: ${{ steps.extract.outputs.java_coverage_report_paths }}

  java_generated_source_dirs:
    # Inferred, not observed: the action runs before the build, so these
    # come from generator plugin declarations and each plugin's documented
    # default. java_generated_sources records which applied per entry.
    description: >-
      Comma-separated directories the build is expected to generate
      sources into, module-relative and inferred from plugin declarations;
      leaves out any path that holds or sits inside hand-written sources
      in some module, so it is safe to apply across the reactor; empty
      when no recognised generator is configured
    value: ${{ steps.extract.outputs.java_generated_source_dirs }}

  java_generated_sources:
    description: >-
      JSON array describing each inferred generated source directory, as
      objects with 'module', 'path', 'plugin' and 'derivation' keys;
      derivation is 'configured' when the POM sets the whole path and
      'plugin-default' when any part of it is the plugin's default
    value: ${{ steps.extract.outputs.java_generated_sources }}

  # Language-Specific Outputs (Go)
  go_base_name:
    description: >-
      Friendly project name derived from the Go module path (the final
      path element, with any semantic import versioning /vN suffix
      stripped, e.g. github.com/user/repo/v2 -> repo)
    value: ${{ steps.extract.outputs.go_base_name }}

  go_module_path:
    description: "Go module path declared in go.mod"
    value: ${{ steps.extract.outputs.go_module_path }}

  go_go_version:
    description: "Minimum Go version declared in go.mod (go directive)"
    value: ${{ steps.extract.outputs.go_go_version }}

  go_metadata_source:
    description: "Source of Go metadata (go.mod)"
    value: ${{ steps.extract.outputs.go_metadata_source }}

  go_toolchain:
    description: "Toolchain directive from go.mod (empty when absent)"
    value: ${{ steps.extract.outputs.go_toolchain }}

  go_dependencies:
    description: >-
      Comma-separated list of direct dependencies in module@version
      form
    value: ${{ steps.extract.outputs.go_dependencies }}

  go_indirect_dependencies:
    description: >-
      Comma-separated list of indirect dependencies in module@version
      form
    value: ${{ steps.extract.outputs.go_indirect_dependencies }}

  go_dependency_count:
    description: "Number of direct dependencies"
    value: ${{ steps.extract.outputs.go_dependency_count }}

  go_total_dependency_count:
    description: "Total number of dependencies (direct plus indirect)"
    value: ${{ steps.extract.outputs.go_total_dependency_count }}

  go_dependency_map:
    description: "JSON object mapping each dependency module to its version"
    value: ${{ steps.extract.outputs.go_dependency_map }}

  go_replace_directives:
    description: >-
      JSON array of replace directives from go.mod, each an object with
      'old' and 'new' keys
    value: ${{ steps.extract.outputs.go_replace_directives }}

  go_replace_count:
    description: "Number of replace directives in go.mod"
    value: ${{ steps.extract.outputs.go_replace_count }}

  go_exclude_directives:
    description: "Comma-separated list of exclude directives from go.mod"
    value: ${{ steps.extract.outputs.go_exclude_directives }}

  go_exclude_count:
    description: "Number of exclude directives in go.mod"
    value: ${{ steps.extract.outputs.go_exclude_count }}

  go_retract_directives:
    description: "Comma-separated list of retract directives from go.mod"
    value: ${{ steps.extract.outputs.go_retract_directives }}

  go_retract_count:
    description: "Number of retract directives in go.mod"
    value: ${{ steps.extract.outputs.go_retract_count }}

  go_frameworks:
    description: >-
      Comma-separated list of detected Go frameworks and tools (Gin,
      Cobra, gRPC, Testify, etc.)
    value: ${{ steps.extract.outputs.go_frameworks }}

  go_go_version_matrix:
    description: >-
      Comma-separated list of Go versions to test against: the
      supported (non-EOL) Go releases at or above the go.mod minimum.
      Sourced live from endoflife.date with a static fallback when the
      API is unreachable.
    value: ${{ steps.extract.outputs.go_go_version_matrix }}

  go_matrix_json:
    description: >-
      Go version test matrix as JSON, ready for workflow matrix
      strategies (e.g. {"go-version": ["1.25", "1.26"]})
    value: ${{ steps.extract.outputs.go_matrix_json }}

  # Language-Specific Outputs (Rust)
  rust_package_name:
    description: "Package name from Cargo.toml [package]"
    value: ${{ steps.extract.outputs.rust_package_name }}

  rust_metadata_source:
    description: "Source of Rust metadata (Cargo.toml)"
    value: ${{ steps.extract.outputs.rust_metadata_source }}

  rust_edition:
    description: >-
      Rust edition from Cargo.toml, inherited from the workspace when
      set there
    value: ${{ steps.extract.outputs.rust_edition }}

  rust_msrv:
    description: >-
      Minimum supported Rust version: the rust-version field of
      Cargo.toml, inherited from the workspace when set there
    value: ${{ steps.extract.outputs.rust_msrv }}

  rust_rust_version:
    description: >-
      Same value as rust_msrv, named after Cargo's rust-version field.
      This is the MSRV the project declares, not a compiler version
    value: ${{ steps.extract.outputs.rust_rust_version }}

  rust_rust_version_matrix:
    description: >-
      Comma-separated Rust versions to test against: the MSRV, the six
      latest stable minor releases at or above it, and "stable". With
      no MSRV, the first release supporting the edition and "stable"
    value: ${{ steps.extract.outputs.rust_rust_version_matrix }}

  rust_matrix_json:
    description: >-
      Rust version test matrix as JSON, ready for workflow matrix
      strategies (e.g. {"rust-version": ["1.80", "stable"]})
    value: ${{ steps.extract.outputs.rust_matrix_json }}

  rust_documentation:
    description: "Documentation URL from Cargo.toml"
    value: ${{ steps.extract.outputs.rust_documentation }}

  rust_keywords:
    description: "Comma-separated package keywords"
    value: ${{ steps.extract.outputs.rust_keywords }}

  rust_categories:
    description: "Comma-separated crates.io categories"
    value: ${{ steps.extract.outputs.rust_categories }}

  rust_publish:
    description: >-
      The package's publish setting, with publish.workspace = true
      resolved from [workspace.package]: "true", "false", or a JSON array
      of the registries allowed. Empty when unset or not resolvable
    value: ${{ steps.extract.outputs.rust_publish }}

  rust_license_file:
    description: "License file path from Cargo.toml"
    value: ${{ steps.extract.outputs.rust_license_file }}

  rust_readme:
    description: "README path from Cargo.toml"
    value: ${{ steps.extract.outputs.rust_readme }}

  rust_dependencies:
    description: >-
      Comma-separated normal dependencies as name@version, marked
      "(optional)" and followed by "[features]" where set. Feature
      lists also contain commas; parse metadata_json for exact values
    value: ${{ steps.extract.outputs.rust_dependencies }}

  rust_dependency_count:
    description: "Number of normal dependencies"
    value: ${{ steps.extract.outputs.rust_dependency_count }}

  rust_optional_dependencies:
    description: "Comma-separated names of optional dependencies"
    value: ${{ steps.extract.outputs.rust_optional_dependencies }}

  rust_dev_dependencies:
    description: "Dev-dependencies, formatted as rust_dependencies"
    value: ${{ steps.extract.outputs.rust_dev_dependencies }}

  rust_dev_dependency_count:
    description: "Number of dev-dependencies"
    value: ${{ steps.extract.outputs.rust_dev_dependency_count }}

  rust_build_dependencies:
    description: "Build-dependencies, formatted as rust_dependencies"
    value: ${{ steps.extract.outputs.rust_build_dependencies }}

  rust_build_dependency_count:
    description: "Number of build-dependencies"
    value: ${{ steps.extract.outputs.rust_build_dependency_count }}

  rust_total_dependency_count:
    description: "Number of normal, dev- and build-dependencies together"
    value: ${{ steps.extract.outputs.rust_total_dependency_count }}

  rust_features:
    description: "JSON object mapping each feature to the features it enables"
    value: ${{ steps.extract.outputs.rust_features }}

  rust_feature_names:
    description: "Comma-separated feature names, sorted"
    value: ${{ steps.extract.outputs.rust_feature_names }}

  rust_feature_count:
    description: "Number of features"
    value: ${{ steps.extract.outputs.rust_feature_count }}

  rust_is_workspace:
    description: >-
      'true' when Cargo.toml lists [workspace] members; empty otherwise
    value: ${{ steps.extract.outputs.rust_is_workspace }}

  rust_workspace_members:
    description: >-
      Comma-separated [workspace] members entries as written, with any
      glob patterns left unexpanded
    value: ${{ steps.extract.outputs.rust_workspace_members }}

  rust_workspace_member_count:
    description: "Number of [workspace] members entries"
    value: ${{ steps.extract.outputs.rust_workspace_member_count }}

  rust_workspace_resolver:
    description: "Dependency resolver version from [workspace]"
    value: ${{ steps.extract.outputs.rust_workspace_resolver }}

  rust_binary_targets:
    description: "Comma-separated names of the declared [[bin]] targets"
    value: ${{ steps.extract.outputs.rust_binary_targets }}

  rust_binary_count:
    description: "Number of declared [[bin]] targets"
    value: ${{ steps.extract.outputs.rust_binary_count }}

  rust_lib_name:
    description: "Library target name from [lib]"
    value: ${{ steps.extract.outputs.rust_lib_name }}

  rust_crate_types:
    description: "Comma-separated [lib] crate types"
    value: ${{ steps.extract.outputs.rust_crate_types }}

  rust_has_build_script:
    description: >-
      'true' when Cargo.toml names a build script in package.build;
      empty otherwise, including for an implicit build.rs
    value: ${{ steps.extract.outputs.rust_has_build_script }}

  rust_build_script:
    description: "Build script path from package.build"
    value: ${{ steps.extract.outputs.rust_build_script }}

  rust_frameworks:
    description: >-
      Comma-separated frameworks detected from normal dependencies
      (Tokio, Serde, Axum, etc.)
    value: ${{ steps.extract.outputs.rust_frameworks }}

  rust_toolchain_kind:
    description: >-
      Toolchain the project's rustup toolchain file selects: 'channel',
      'path' (a directory of binaries) or 'none' (no channel or path:
      no file, a file rustup rejects, or a valid file with components
      or targets but no channel or path, which leaves rustup on its
      default toolchain); read from the file, never by running rustup
    value: ${{ steps.extract.outputs.rust_toolchain_kind }}

  rust_toolchain_file:
    description: >-
      Toolchain file rustup reads, relative to the project directory
      (rust-toolchain or rust-toolchain.toml, here or in a parent)
    value: ${{ steps.extract.outputs.rust_toolchain_file }}

  rust_toolchain_channel:
    description: >-
      Channel or toolchain name the toolchain file selects; empty for a
      path toolchain
    value: ${{ steps.extract.outputs.rust_toolchain_channel }}

  rust_toolchain_components:
    description: "Comma-separated components from the toolchain file"
    value: ${{ steps.extract.outputs.rust_toolchain_components }}

  rust_toolchain_targets:
    description: "Comma-separated targets from the toolchain file"
    value: ${{ steps.extract.outputs.rust_toolchain_targets }}

  rust_toolchain_profile:
    description: "Profile from the toolchain file: minimal, default or complete"
    value: ${{ steps.extract.outputs.rust_toolchain_profile }}

  # Success Indicator
  success:
    description: "Whether extraction succeeded"
    value: ${{ steps.extract.outputs.success }}

runs:
  using: "composite"
  steps:
    - name: "Setup Go"
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: '1.25.x'
        cache: false

    - name: "Build and Extract Metadata"
      id: extract
      shell: bash
      env:
        INPUT_PATH_PREFIX: ${{ inputs.path_prefix }}
        INPUT_PROJECT_TYPE: ${{ inputs.project_type }}
        INPUT_OUTPUT_FORMAT: ${{ inputs.output_format }}
        INPUT_INCLUDE_ENVIRONMENT: ${{ inputs.include_environment }}
        INPUT_USE_VERSION_EXTRACT: ${{ inputs.use_version_extract }}
        INPUT_VERBOSE: ${{ inputs.verbose }}
        INPUT_ARTIFACT_UPLOAD: ${{ inputs.artifact_upload }}
        INPUT_ARTIFACT_NAME_PREFIX: ${{ inputs.artifact_name_prefix }}
        INPUT_ARTIFACT_FORMATS: ${{ inputs.artifact_formats }}
        INPUT_VALIDATE_OUTPUT: ${{ inputs.validate_output }}
        INPUT_STRICT_VALIDATION: ${{ inputs.strict_validation }}
        INPUT_EXPORT_ENV_VARS: ${{ inputs.export_env_vars }}
        # Python-specific extractor inputs. The Go binary reads these
        # via go-githubactions which expects INPUT_* environment
        # variables. Without these mappings the user-supplied values
        # would be silently ignored and the extractor would always use
        # its built-in defaults.
        INPUT_PYTHON_OFFLINE_MODE: ${{ inputs.python_offline_mode }}
        INPUT_PYTHON_EOL_TIMEOUT: ${{ inputs.python_eol_timeout }}
        INPUT_PYTHON_EOL_MAX_RETRIES: ${{ inputs.python_eol_max_retries }}
        # Env-mediated to avoid template expansion inside the run block
        ACTION_PATH: ${{ github.action_path }}
      run: |
        # This action requires the Go binary to be built
        # In production, this would be pre-built or use Docker
        echo "::group::Building build-metadata-action"
        # Save the original working directory (where the workflow is running)
        ORIGINAL_DIR="$(pwd)"
        # Create temporary directory for the binary
        TEMP_BIN_DIR="$(mktemp -d)"
        # Build the binary to temporary location
        cd "${ACTION_PATH}"
        go build -buildvcs=false \
          -o "${TEMP_BIN_DIR}/build-metadata" ./cmd/build-metadata
        # Return to the original working directory
        cd "${ORIGINAL_DIR}"
        echo "::endgroup::"

        echo "::group::Extracting Build Metadata"
        # Run the binary from the original working directory
        "${TEMP_BIN_DIR}/build-metadata"
        # Clean up temporary directory
        rm -rf "${TEMP_BIN_DIR}"
        echo "::endgroup::"
